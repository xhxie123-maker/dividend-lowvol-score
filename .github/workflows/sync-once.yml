name: sync-once
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并校验九个文件
        run: |
          set -euo pipefail
          fetch() { curl -sSL --retry 3 "https://aka.doubaocdn.com/s/$1" -o "$2"; }
          fetch zfM4tEOpkE config.json
          fetch 1OUNtyttV3 README.md
          fetch 8ZZoq3bVnp dividend_lowvol_score.py
          mkdir -p dlv
          fetch FbPEOyUmxn dlv/model.py
          fetch tZUj8tM6wr dlv/pit.py
          fetch DavVOM8pXV dlv/upgrade.py
          fetch oW87UWXwAe dlv/report.py
          fetch or2VHAmOU3 backtest/upgrade.md
          fetch oITwgn49GU backtest/upgrade.csv
          wc -c config.json README.md dividend_lowvol_score.py dlv/model.py dlv/pit.py dlv/upgrade.py dlv/report.py backtest/upgrade.md backtest/upgrade.csv
          python3 - <<'PY'
          import os
          exp = {"config.json": 3682, "README.md": 11768,
                 "dividend_lowvol_score.py": 17770, "dlv/model.py": 20590,
                 "dlv/pit.py": 21000, "dlv/upgrade.py": 36117,
                 "dlv/report.py": 26722, "backtest/upgrade.md": 13131,
                 "backtest/upgrade.csv": 5071}
          for p, n in exp.items():
              got = os.path.getsize(p)
              assert got == n, (p, got, n)
          print("SIZE_OK")
          PY
          python3 -m py_compile dlv/model.py dlv/pit.py dlv/upgrade.py dlv/report.py dividend_lowvol_score.py
          echo COMPILE_OK

      - name: 提交并移除一次性工作流
        run: |
          set -euo pipefail
          git rm -q .github/workflows/sync-once.yml
          git config user.name "xhxie123-maker"
          git config user.email "xhxie123-maker@users.noreply.github.com"
          git add -A
          git commit -m "feat: 新增「红利/成长相对强弱」打分项（A 方案 3 分 + 拥挤闸），rs 改 120 日慢变量，upgrade 增三臂对比"
          git push
