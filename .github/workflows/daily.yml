name: 每日红利低波评分

on:
  schedule:
    # UTC 08:20 = 北京时间 16:20，周一至周五收盘后（15:00 收盘，留 80 分钟等行情与净值接口更新）
    - cron: "20 8 * * 1-5"
    # 临时补跑：修复东财日线失败回退腾讯后，每 20 分钟跑一次补齐今日两只标的，确认后删除本行
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dividend-lowvol-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存个股 PIT 数据（不入库）
        uses: actions/cache@v4
        with:
          path: data/cache/pit
          key: pit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pit-${{ runner.os }}-

      - name: 免费数据源连通性自检
        continue-on-error: true
        run: python -m dlv.probe

      - name: 计算评分并生成日志、看板与回测
        run: python dividend_lowvol_score.py --backtest

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "本次运行无变更，跳过提交"
          else
            git commit -m "chore: 每日评分更新 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 运行摘要
        run: |
          echo "### 最新评分" >> $GITHUB_STEP_SUMMARY
          tail -n 2 data/daily_scores.csv >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 数据源自检" >> $GITHUB_STEP_SUMMARY
          cat logs/source_probe.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 回测要点" >> $GITHUB_STEP_SUMMARY
          sed -n '/## 五、组合对照/,/^$/p' backtest/report.md | head -n 12 >> $GITHUB_STEP_SUMMARY
